<p>home works!</p>
<h1>Home Page</h1>
<hr>



<div class="btn-group" role="group" aria-label="Basic outlined example">

  <button
    type="button"
    class="btn"
    [ngClass]="isadmin ? 'btn-success' : 'btn-outline-primary'"
    (click)="switchRole('admin')">
    Admin
  </button>

  <button
    type="button"
    class="btn"
    [ngClass]="!isadmin ? 'btn-success' : 'btn-outline-primary'"
    (click)="switchRole('member')">
    Member
  </button>

</div>

@if(isadmin){
    <app-admin></app-admin>
}
@else{
    <app-member></app-member>
}


<h2>User List</h2>

<table border="1">

  <thead>
    <tr>
      <th>Id</th>
      <th>Name</th>
      <th>Username</th>
      <th>Email</th>
    </tr>
  </thead>

  <tbody>
    @for(user of users; track user.id) {
      <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.name }}</td>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
      </tr>
    }
  </tbody>

</table>
