<p>directive-demo works!</p>
<table class="table table-striped table-bordered">
    <thead>
        <tr>
            <th>Movie ID</th>
            <th>Movie Title</th>
            <th>Movie Rating</th>
            <th>Release Date</th>
            <th>Genre ID</th>
        </tr>
    </thead>
    <tbody>
        @for(m of listMovie; track m.movieId; let idx = $index; let o=$odd)
        {
            <tr>
   <td [ngStyle]="{'font-weight': m.movieId % 2 == 0 ? 'bold' : 'normal'}">
                            {{ m.movieId }}</td>
                <td>{{ m.movieTitle }}</td>
                <td>{{ m.movieRating }}</td>
                <td>{{ m.releaseDate | date }}</td>
                <td>{{ m.genreId }}</td>
            </tr>
        }@empty
        {
            <tr>
                <td colspan="5">No data is present in the list</td>
            </tr>
        }
    </tbody>
</table>
